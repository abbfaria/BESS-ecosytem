# Eclipse Mosquitto 2.x — Cloud MQTT Broker
# Listeners: 8883 (mTLS, ACL-restricted) + 1883 (internal Docker network only)
#
# per_listener_settings lets each listener carry its own allow_anonymous /
# acl_file, so the mTLS listener stays locked down per-device while the
# internal listener (only reachable from other containers on the isolated
# cloud-net bridge — no host port is published beyond 127.0.0.1) stays open
# for trusted cloud-side services (cloud-api, healthchecks) without them
# needing to authenticate.
per_listener_settings true

# ── TLS listener (public, for edge devices) ──────────────────────────────────
listener 8883
protocol mqtt

# Server certificate (issued by our CA)
certfile  /mosquitto/certs/server.crt
keyfile   /mosquitto/certs/server.key

# CA certificate — REQUIRE client certificates (mTLS)
cafile    /mosquitto/certs/ca.crt
require_certificate true

# Only allow clients whose CN matches their MQTT username
use_identity_as_username true

tls_version tlsv1.3

allow_anonymous false
acl_file /mosquitto/config/acl.conf

# ── Internal listener (Docker network only, no TLS) ───────────────────────────
# NOT bound to the container's own loopback — must accept connections from
# other containers on the cloud-net bridge (e.g. cloud-api reaching this
# broker via the "mosquitto" service name), not just from within this
# container's own network namespace.
listener 1883
protocol mqtt
allow_anonymous true      # trusted: only reachable from the isolated cloud-net bridge

# ── General settings ─────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections 500
max_queued_messages 1000
max_inflight_messages 50
