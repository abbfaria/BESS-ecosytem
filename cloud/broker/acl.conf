# Mosquitto ACL file
#
# Pattern: {BESS device CN} = "bess-edge-NN"
# Cloud API subscriber CN  = "cloud-api"
#
# Devices may only publish to their own bess/{device_id}/... topics
# and subscribe to their own downlink topics.
# The cloud API may subscribe to all uplink and publish to all downlink.

# ── Cloud API service account ─────────────────────────────────────────────────
user cloud-api
topic readwrite bess/#

# ── Grafana / monitoring (read-only) ─────────────────────────────────────────
user grafana-reader
topic read bess/#

# ── Pattern ACL for edge devices ──────────────────────────────────────────────
# %u is substituted with the authenticated MQTT username (= device CN)

# Edge → Cloud (publish)
pattern write bess/%u/telemetry
pattern write bess/%u/status
pattern write bess/%u/cmd_ack
pattern write bess/%u/market_ack
pattern write bess/%u/fault
pattern write bess/%u/buffer_stats
pattern write bess/%u/lwt

# schedule is bidirectional: edge publishes its own locally-computed
# schedule up to the cloud (main.py's _market_loop), and also receives
# a schedule pushed down from the cloud (_apply_remote_schedule) on the
# same topic -- readwrite, not read-only, or the broker silently denies
# the edge's own uplink publish (rc135 "Not authorized").
pattern readwrite bess/%u/schedule

# Cloud → Edge (subscribe)
pattern read bess/%u/cmd
pattern read bess/%u/market
