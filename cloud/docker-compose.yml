# Cloud side: MQTT broker (mTLS :8883 for edges, plain :1883 internal),
# InfluxDB, Grafana, and cloud-api (MQTT -> InfluxDB + history seeding).

services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bess-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "127.0.0.1:1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/acl.conf:/mosquitto/config/acl.conf:ro
      - ./certs:/mosquitto/certs:ro
    networks: [cloud-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -p 1883 -t healthcheck -r -m ok && mosquitto_sub -p 1883 -t healthcheck -C 1 -W 5"]
      interval: 30s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7
    container_name: bess-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE:        setup
      DOCKER_INFLUXDB_INIT_USERNAME:    "${INFLUXDB_ADMIN_USER:-admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD:    "${INFLUXDB_ADMIN_PASSWORD:-changeme123}"
      DOCKER_INFLUXDB_INIT_ORG:         "${INFLUXDB_ORG:-bess}"
      DOCKER_INFLUXDB_INIT_BUCKET:      "${INFLUXDB_BUCKET:-telemetry}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_TOKEN:-dev-token-change-in-prod}"
      INFLUXD_REPORTING_DISABLED:       "true"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    networks: [cloud-net]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.2
    container_name: bess-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-changeme}"
      GF_SERVER_ROOT_URL:         "${GF_ROOT_URL:-http://localhost:3000}"
      INFLUXDB_TOKEN:             "${INFLUXDB_TOKEN:-dev-token-change-in-prod}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [cloud-net]

  cloud-api:
    build:
      # Repo root: the image also copies edge/src/bess_model.py.
      context: ..
      dockerfile: cloud/api/Dockerfile
    container_name: bess-cloud-api
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      MQTT_BROKER_HOST: "mosquitto"
      MQTT_BROKER_PORT: "1883"
      INFLUXDB_URL:     "http://influxdb:8086"
      INFLUXDB_TOKEN:   "${INFLUXDB_TOKEN:-dev-token-change-in-prod}"
      INFLUXDB_ORG:     "${INFLUXDB_ORG:-bess}"
      INFLUXDB_BUCKET:  "${INFLUXDB_BUCKET:-telemetry}"
      DEVICE_ID:        "${DEVICE_ID:-bess-edge-01}"
      LOG_LEVEL:        "${LOG_LEVEL:-INFO}"
    ports:
      - "127.0.0.1:8080:8080"
    networks: [cloud-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:

networks:
  cloud-net:
    driver: bridge
