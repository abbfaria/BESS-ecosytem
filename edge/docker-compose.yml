version: "3.9"

services:
  edge-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bess-edge
    restart: unless-stopped

    environment:
      # Override values from config.yaml via environment variables
      DEVICE_ID:           "${DEVICE_ID:-bess-edge-01}"
      MQTT_HOST:           "${MQTT_HOST:-cloud.bess.local}"
      MQTT_PORT:           "${MQTT_PORT:-8883}"
      CA_CERT:             "/certs/ca.crt"
      CLIENT_CERT:         "/certs/edge.crt"
      CLIENT_KEY:          "/certs/edge.key"
      TELEMETRY_INTERVAL_S: "${TELEMETRY_INTERVAL_S:-10}"
      STATUS_INTERVAL_S:    "${STATUS_INTERVAL_S:-60}"
      ENTSOE_TOKEN:         "${ENTSOE_TOKEN:-}"
      DATA_DIR:             "/data"
      LOG_LEVEL:            "${LOG_LEVEL:-INFO}"

    volumes:
      # TLS certificates (generated by generate_certs.sh)
      - ./certs:/certs:ro
      # Persistent DB files
      - edge-data:/data
      # Optional: override config
      - ./config/config.yaml:/app/config/config.yaml:ro

    ports:
      - "127.0.0.1:8000:8000"   # local API only on loopback (not exposed to internet)

    networks:
      - edge-net

    # Resource limits for embedded/edge hardware
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

volumes:
  edge-data:

networks:
  edge-net:
    driver: bridge
