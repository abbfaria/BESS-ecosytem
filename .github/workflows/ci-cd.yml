name: BESS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q edge/src cloud/api/src tests
      - run: python -m unittest discover -s tests -v
      - name: Validate compose files
        run: |
          docker compose -f cloud/docker-compose.yml config -q
          docker compose -f edge/docker-compose.yml config -q
      - name: Build images
        run: |
          docker build -f cloud/api/Dockerfile -t bess-cloud-api .
          docker build -t bess-edge edge

  # Deploy only on a direct push to main, on self-hosted runners on each VM.
  deploy-cloud:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cloud]
    steps:
      - uses: actions/checkout@v4
      - name: Sync code (preserve .env / certs / data)
        run: |
          rsync -a --delete \
            --exclude '.env' --exclude 'certs/' --exclude 'data/' --exclude '__pycache__/' \
            cloud/ "$HOME/Code/bess-ecosystem/cloud/"
          # cloud-api's image copies edge/src/bess_model.py (shared model).
          rsync -a --delete --exclude '__pycache__/' \
            edge/src/ "$HOME/Code/bess-ecosystem/edge/src/"
      - name: Build and deploy
        run: |
          cd "$HOME/Code/bess-ecosystem/cloud"
          docker compose -p bess-cloud up -d --build --remove-orphans
      - name: Health check
        run: |
          sleep 15
          curl -sf http://localhost:8080/health

  deploy-edge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, edge]
    steps:
      - uses: actions/checkout@v4
      - name: Sync code (preserve .env / certs / data)
        run: |
          rsync -a --delete \
            --exclude '.env' --exclude 'certs/' --exclude 'data/' --exclude '__pycache__/' \
            edge/ "$HOME/Code/bess-ecosystem/edge/"
      - name: Build and deploy
        run: |
          cd "$HOME/Code/bess-ecosystem/edge"
          docker compose -p bess-edge up -d --build --remove-orphans
      - name: Health check
        run: |
          sleep 10
          test "$(docker inspect -f '{{.State.Running}}' bess-edge)" = true
